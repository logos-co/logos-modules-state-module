name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    environment: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Logos nix cache: reads cache.nix.logos.co (public + ci) and publishes
      # what this job builds; logos-co.cachix.org stays as a read-only fallback.
      - name: Set up Nix and the Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          extra-nix-config: |
            extra-substituters = https://logos-co.cachix.org
            extra-trusted-public-keys = logos-co.cachix.org-1:12K8609ho1pCt0erUQrOrs/KmOuhWq/EhVwhzQRb35E=

      - name: Build module
        run: nix build -L

      # `.#unit-tests` is the SAME DERIVATION as checks.<system>.unit-tests
      # (verified: identical drvPath), and it RUNS the suite rather than only
      # compiling it. That distinction matters here: mkLogosModuleTests finds
      # suites with
      #   find . -maxdepth 1 -executable \( -name "*_tests" -o -name "*_test" \)
      # so a binary named anything else is built, matched by nothing, never
      # executed -- and the check still goes GREEN. This suite was once named
      # `modules_state_invariants` and passed three mutation tests it should
      # have caught before that was spotted.
      - name: Run unit tests
        run: nix build .#unit-tests -L

      # Packaging is a separate failure mode from compiling: the .lgx payload
      # layout and the install tree are built by different code than the plugin.
      - name: Build installable package
        run: nix build .#install -L
